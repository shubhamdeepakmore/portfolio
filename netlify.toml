# Netlify configuration — plain static site, no build step.
# The whole repository root IS the website, so we just tell
# Netlify to publish it directly.

[build]
  publish = "."
  # No build command: files are served exactly as they are in the repo.

# Caching: always revalidate HTML, CSS and JS so edits show up on the
# next visit. Netlify sends an ETag, so unchanged files come back as a
# tiny "304 Not Modified" — you get fresh content without re-downloading
# files that didn't change. (This site has no build step / fingerprinted
# filenames, so aggressive caching would serve stale styles.)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # CSP scoped to exactly what the site uses: same-origin assets, inline
    # styles/scripts (theme no-flash script, inline style attrs), and Google Fonts.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'"
